name: Audiobookshelf
version: "1.0.7"
slug: audiobookshelf
description: Audiobookshelf server for Home Assistant with ingress proxy
url: https://www.audiobookshelf.org/
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false

ingress: true
ingress_port: 8099
ingress_stream: true

panel_icon: mdi:book-open-variant
panel_title: Audiobookshelf

map:
  - type: media
    read_only: false
  - type: share
    read_only: false

environment:
  HOST: 127.0.0.1
  PORT: "80"
  CONFIG_PATH: /data/config
  METADATA_PATH: /data/metadata
  BACKUP_PATH: /data/metadata/backups
  SOURCE: hass-addon

schema: false
