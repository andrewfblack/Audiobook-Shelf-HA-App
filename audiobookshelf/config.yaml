name: Audiobookshelf
version: "1.0.9"
slug: audiobookshelf
description: Audiobookshelf server for Home Assistant
url: https://www.audiobookshelf.org/
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false

panel_icon: mdi:book-open-variant
panel_title: Audiobookshelf

webui: "http://[HOST]:[PORT:13378]"
watchdog: "tcp://[HOST]:[PORT:13378]"

ports:
  13378/tcp: 13378
ports_description:
  13378/tcp: Web interface

map:
  - type: media
    read_only: false
  - type: share
    read_only: false

environment:
  HOST: 0.0.0.0
  PORT: "13378"
  CONFIG_PATH: /data/config
  METADATA_PATH: /data/metadata
  BACKUP_PATH: /data/metadata/backups
  SOURCE: hass-addon

schema: false
